services:
  web:
    build: .
    image: fusionlab_group01_web:latest
    restart: unless-stopped
    container_name: group01_web
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.group01-web.rule=Host(`tulrgis-itbe-fl.srv.mwn.de`) && PathPrefix(`/group01`)'
      - 'traefik.http.routers.group01-web.entrypoints=websecure'
      - 'traefik.http.routers.group01-web.tls=true'
      - 'traefik.http.middlewares.group01-stripprefix.stripprefix.prefixes=/group01'
      - 'traefik.http.routers.group01-web.middlewares=group01-stripprefix'
      - 'traefik.http.services.group01-web.loadbalancer.server.port=80'
    networks:
      - webproxy

networks:
  webproxy:
    external: true
